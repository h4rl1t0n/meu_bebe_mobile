# =============================================================================
# Threshold analysis v1 — ANÁLISE SECUNDÁRIA EXPLORATÓRIA (FASE 3G-A)
# =============================================================================
#
# Análise SECUNDÁRIA e EXPLORATÓRIA do comportamento do threshold do Random
# Forest selecionado, usando EXCLUSIVAMENTE as predições out-of-fold do
# conjunto de TREINAMENTO (data/processed/cv_oof_predictions_v1.csv, 4000
# registros; somente row_index / y_true / random_forest_probability).
#
# NÃO é uma escolha operacional de threshold. Nenhum threshold é selecionado
# aqui: a análise apenas DESCREVE o trade-off entre sensibilidade e precisão
# em vários pontos de corte exploratórios, mantendo 0.50 como threshold
# primário de referência (o mesmo do protocolo congelado).
#
# REGRA DE OURO DO TEST SET (mantida): o TEST não é aberto, não é usado para
# nenhuma decisão de threshold e nenhum threshold é avaliado no TEST nesta fase.
# =============================================================================

version: "1.0"
analysis_type: "secondary_exploratory"
source: "OOF TRAIN"
model: "random_forest"
n_expected: 4000

# Threshold primário de referência (o do protocolo congelado; NÃO alterar).
primary_threshold_reference: 0.50

# Grade exploratória de thresholds (46 pontos: 0.05, 0.06, ..., 0.50).
threshold_grid:
  start: 0.05
  stop: 0.50
  step: 0.01

# Thresholds de referência destacados no relatório (subconjunto da grade).
reference_thresholds:
  - 0.10
  - 0.15
  - 0.20
  - 0.25
  - 0.30
  - 0.35
  - 0.40
  - 0.45
  - 0.50

# Seleção de threshold NÃO é feita nesta fase (nenhum alvo clínico validado
# para recall/precisão foi definido). Mantém-se o threshold primário 0.50.
selection:
  enabled: false
