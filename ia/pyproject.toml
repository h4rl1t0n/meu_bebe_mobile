[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "meu-bebe-ml"
version = "0.1.0"
description = "Componente de IA/ML do projeto Meu Bebê (experimento com dataset sintético — contrato DSS 1.13)."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary (uso acadêmico — TCC IFAM)" }
authors = [{ name = "Harliton Martins" }]
keywords = ["dss", "prenatal", "synthetic-data", "machine-learning", "tcc"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Development Status :: 3 - Alpha",
]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "xgboost>=2.0",
    "pyyaml>=6.0",
    "joblib>=1.3",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
