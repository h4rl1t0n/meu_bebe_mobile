# Alembic — configuração de migrations da API Meu Bebê (FASE 8B).
#
# A URL de conexão NÃO é hardcoded aqui (nunca versionar senha): o ``env.py``
# lê ``DATABASE_URL`` a partir de ``meu_bebe_api.config`` (Settings), que por sua
# vez lê do ambiente/``.env`` (fora do git). Deixe ``sqlalchemy.url`` vazio.

[alembic]
script_location = alembic
prepend_sys_path = src
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
